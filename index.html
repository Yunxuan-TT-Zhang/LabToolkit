<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabToolkit — lab calculators that don't waste your time</title>
<meta name="description" content="A fast, clean suite of bench calculators: molarity, dilutions, A280, buffers, plate layouts, primer Tm.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Installable web app (PWA). The service worker only registers when the page is
     served over http(s); opening index.html directly as a file still works, just without
     offline install. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5d7389" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LabToolkit">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 720 620" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 24 H278 M150 24 V270"/>
          <path d="M442 24 H698 M570 24 V270"/>
          <path d="M300 205 V385 M300 385 H398"/>
          <path d="M64 435 C 200 615, 520 615, 656 435"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">LabToolkit</div>
        <div class="brand-sub">bench calculators</div>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="installBtn" type="button" hidden>Install app</button>
      <button class="ghost-btn" id="themeToggle" type="button">Toggle theme</button>
      <div class="muted tiny">Calculators run in your browser. Saved items stay on this device — see About &amp; privacy.</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="ghost-btn only-mobile" id="menuBtn" type="button">Menu</button>
      <div class="topbar-title" id="topbarTitle">Molarity</div>
      <div class="topbar-actions">
        <button class="ghost-btn" id="authBtn" type="button">Sign in / Register</button>
      </div>
    </header>

    <div class="content" id="content"></div>

    <footer class="foot" id="foot">
      <span class="muted tiny">
        LabToolkit performs standard textbook calculations. Always sanity-check values
        against your own records before use at the bench.
      </span>
      <button class="foot-close" id="footClose" type="button" aria-label="Dismiss this notice" title="Dismiss">×</button>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- First-visit prompt teaching how to install to the home screen. Shown by app.js only
     when not already installed and not previously dismissed. -->
<div class="install-banner" id="installBanner" hidden>
  <div class="ib-text"></div>
  <div class="ib-actions">
    <button class="primary-btn" id="ibAction" type="button" hidden>Install</button>
    <button class="ghost-btn" id="ibDismiss" type="button">Got it</button>
  </div>
</div>

<script src="config.js"></script>
<script src="e2e.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
